name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Node 22
          cache: npm

      - run: npm ci

      # Dev-only defaults; no real secrets are needed for these checks.
      - run: cp .env.example .env

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
